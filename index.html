<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>3D Portfolio - พรรษิษฐ์ เอี่ยมวิไล</title>
<style>
  :root { 
    box-sizing: border-box; 
    padding-top: env(safe-area-inset-top, 0px); 
    padding-bottom: env(safe-area-inset-bottom, 0px); 
  }
  html, body { 
    margin: 0; 
    padding: 0; 
    overflow: hidden; 
    background: #0d1b2a; 
    height: 100%; 
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-controls {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 20;
    width: 92%;
    max-width: 540px;
  }

  .button-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    width: 100%;
  }

  .btn {
    background: rgba(255, 255, 255, 0.95);
    color: #0f172a;
    font-weight: 700;
    border: 1px solid rgba(255, 255, 255, 0.6);
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    font-size: 13px;
    flex: 1;
    text-align: center;
    outline: none;
    touch-action: manipulation;
  }

  .btn:hover, .btn:active {
    background: #ffffff;
    color: #ff007f;
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 8px 24px rgba(255, 0, 127, 0.35);
    border-color: #ff007f;
  }

  .btn-portfolio {
    background: linear-gradient(135deg, #ff007f, #7928ca, #00f0ff);
    background-size: 200% 200%;
    animation: gradientShift 4s ease infinite;
    color: #ffffff;
    max-width: 170px;
    border: none;
    box-shadow: 0 6px 20px rgba(255, 0, 127, 0.4);
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .btn-portfolio:hover, .btn-portfolio:active {
    color: #ffffff;
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 10px 28px rgba(255, 0, 127, 0.6);
  }


  /* Interactive floating Earth */
  canvas { touch-action: none; }
  .btn-globe {
    max-width: 170px;
    background: linear-gradient(135deg, #043b60, #007f9f);
    color: #fff;
    border-color: #35c8ff;
  }
  @media (max-width: 600px) {
    #ui-controls { bottom: max(12px, env(safe-area-inset-bottom, 0px)); gap: 6px; }
    .button-row { gap: 5px; }
    .btn { font-size: 11px; padding: 9px 5px; }
  }

</style>
</head>
<body>

<div id="ui-controls">
  <div class="button-row">
    <button class="btn" id="btn-overview">ภาพรวม</button>
    <button class="btn" id="btn-pc">หน้าจอ PC</button>
    <button class="btn" id="btn-desk">โต๊ะทำงาน</button>
  </div>
  <div class="button-row">

    <button class="btn" id="btn-photo">หน้ารูปภาพของฉัน</button>
    <button class="btn" id="btn-window">หน้าต่าง</button>
  </div>
  <div class="button-row">
    <button class="btn btn-globe" id="btn-globe">🌍 ดูลูกโลก</button>
    <button class="btn btn-portfolio" id="btn-portfolio">Portfolio</button>

<script type="importmap">

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();

function makeSpaceSkyTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 1024;
  canvas.height = 1024;
  const ctx = canvas.getContext("2d");

  const grad = ctx.createRadialGradient(520, 380, 60, 512, 512, 760);
  grad.addColorStop(0.0, "#25175f");
  grad.addColorStop(0.25, "#120f36");
  grad.addColorStop(0.6, "#070b1c");
  grad.addColorStop(1.0, "#010205");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1024, 1024);

  for (let i = 0; i < 28; i++) {
    const x = Math.random() * 1024;
    const y = Math.random() * 1024;
    const r = 90 + Math.random() * 180;
    const neb = ctx.createRadialGradient(x, y, 0, x, y, r);
    const hue = [185, 210, 285, 320][i % 4];
    neb.addColorStop(0.0, `hsla(${hue}, 100%, 70%, 0.18)`);
    neb.addColorStop(0.45, `hsla(${hue}, 100%, 60%, 0.07)`);
    neb.addColorStop(1.0, `hsla(${hue}, 100%, 40%, 0.0)`);
    ctx.fillStyle = neb;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = 0; i < 950; i++) {
    const x = Math.random() * 1024;
    const y = Math.random() * 1024;
    const size = Math.random() * 2.4 + 0.2;
    const alpha = 0.35 + Math.random() * 0.65;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
scene.background = makeSpaceSkyTexture();
scene.fog = new THREE.FogExp2(0x08111f, 0.012);

const camera = new THREE.PerspectiveCamera(

function generateSpaceFloorTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 1024;
  canvas.height = 1024;
  const ctx = canvas.getContext("2d");

  const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
  grad.addColorStop(0, '#101828');
  grad.addColorStop(1, '#060b14');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1024, 1024);

  ctx.strokeStyle = 'rgba(90, 190, 255, 0.18)';
  ctx.lineWidth = 3;
  for (let x = 0; x <= 1024; x += 128) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, 1024);
    ctx.stroke();
  }
  for (let y = 0; y <= 1024; y += 128) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(1024, y);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(255, 70, 200, 0.10)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const inset = 40 + i * 120;
    ctx.strokeRect(inset, inset, 1024 - inset * 2, 1024 - inset * 2);
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2, 2);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

const stemMat = new THREE.MeshStandardMaterial({ color: 0x3f7d42, roughness: 0.7 });
const petalMatPink = new THREE.MeshStandardMaterial({ color: 0xff6fa5, roughness: 0.5 });
const petalMatYellow = new THREE.MeshStandardMaterial({ color: 0xffd24c, roughness: 0.5 });
const flowerCenterMat = new THREE.MeshStandardMaterial({ color: 0x7a4a1e, roughness: 0.6 });

function makeFlowerPot(petalMat) {
  const group = new THREE.Group();
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.12, 0.22, 16), terracottaMat);
  pot.position.y = 0.11;
  pot.castShadow = true; pot.receiveShadow = true;
  group.add(pot);

  for (let i = 0; i < 3; i++) {
    const angle = (i / 3) * Math.PI * 2;
    const stemH = 0.3 + Math.random() * 0.08;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, stemH, 6), stemMat);
    stem.position.set(Math.cos(angle) * 0.05, 0.22 + stemH / 2, Math.sin(angle) * 0.05);
    stem.castShadow = true;
    group.add(stem);

    const flowerGroup = new THREE.Group();
    const center = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), flowerCenterMat);
    flowerGroup.add(center);
    for (let p = 0; p < 5; p++) {
      const pa = (p / 5) * Math.PI * 2;
      const petal = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), petalMat);
      petal.position.set(Math.cos(pa) * 0.055, 0, Math.sin(pa) * 0.055);
      petal.scale.set(1, 0.6, 1);
      flowerGroup.add(petal);
    }
    flowerGroup.position.set(Math.cos(angle) * 0.05, 0.22 + stemH, Math.sin(angle) * 0.05);
    flowerGroup.traverse(o => { if (o.isMesh) o.castShadow = true; });
    group.add(flowerGroup);
  }
  return group;
}

function drawGlowingNeonText(text, x, y, fontSize, strokeColor, fillColor) {
  mCtx.font = `Bold ${fontSize}px 'Segoe UI', 'Tahoma', sans-serif`;
  mCtx.shadowColor = strokeColor;
  mCtx.shadowBlur = 35;
  mCtx.fillStyle = strokeColor;
  mCtx.fillText(text, x, y);
  mCtx.shadowBlur = 15;
  mCtx.fillText(text, x, y);
  mCtx.shadowBlur = 4;
  mCtx.fillStyle = fillColor;
  mCtx.fillText(text, x, y);
}

const pickableObjects = [];
function registerPickable(mesh, title, detail, onPick) {
  mesh.userData.pickTitle = title;
  mesh.userData.pickDetail = detail;
  mesh.userData.onPick = onPick;
  pickableObjects.push(mesh);

function makeToonGradient() {
  const data = new Uint8Array([20, 80, 150, 255]);
  const texture = new THREE.DataTexture(data, 4, 1, THREE.RedFormat);
  texture.needsUpdate = true;
  texture.minFilter = THREE.NearestFilter;
  texture.magFilter = THREE.NearestFilter;
  texture.generateMipmaps = false;
  return texture;
}

const earthVertexShader = /* glsl */ `
  uniform float uTime;
  varying vec2 vUv;
  varying vec3 vWorldNormal;
  varying vec3 vWorldPosition;
  varying float vWave;
  void main() {
    vUv = uv;
    float wave = sin(position.y * 12.0 + uTime * 2.0) * cos(position.x * 11.0 - uTime * 1.7);
    float ripple = sin((position.z + position.x) * 10.0 + uTime * 1.3);
    float displacement = (wave * 0.010) + (ripple * 0.006);
    vec3 displacedPosition = position + normal * displacement;
    vec3 displacedNormal = normalize(normal + vec3(displacement * 1.6));
    vec4 worldPosition = modelMatrix * vec4(displacedPosition, 1.0);
    vWave = displacement;
    vWorldPosition = worldPosition.xyz;
    vWorldNormal = normalize(mat3(modelMatrix) * displacedNormal);
    gl_Position = projectionMatrix * viewMatrix * worldPosition;
  }
`;

const earthFragmentShader = /* glsl */ `
  uniform sampler2D uEarthTexture;
  uniform vec3 uSunDirection;
  uniform float uTime;
  varying vec2 vUv;
  varying vec3 vWorldNormal;
  varying vec3 vWorldPosition;
  varying float vWave;
  void main() {
    vec3 normal = normalize(vWorldNormal);
    vec3 viewDir = normalize(cameraPosition - vWorldPosition);
    vec3 dayMap = texture2D(uEarthTexture, vUv).rgb;

    // Physically suggestive day/night gradient; the dark side stays visible.
    float sunlight = dot(normal, normalize(uSunDirection));
    float day = smoothstep(-0.32, 0.54, sunlight);
    vec3 surface = dayMap * (0.17 + day * 1.03);

    // Soft water glints and a subtle atmospheric rim (fragment shader effects).
    float ocean = smoothstep(0.04, 0.23, dayMap.b - dayMap.r * 0.65);
    vec3 reflected = reflect(-normalize(uSunDirection), normal);
    float specular = pow(max(dot(reflected, viewDir), 0.0), 30.0);
    surface += vec3(0.24, 0.49, 0.78) * specular * ocean * day * 0.33;
    float rim = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.2);
    surface += vec3(0.03, 0.24, 0.49) * rim;

    // Very gentle animated luminosity to give the globe a living digital feel.
    surface += vec3(0.008, 0.018, 0.029) * (0.5 + 0.5 * sin(uTime * 1.5));
    surface += vec3(0.02, 0.05, 0.08) * smoothstep(0.003, 0.014, abs(vWave));
    gl_FragColor = vec4(surface, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }
`;

const sunDirection = new THREE.Vector3(-0.5, 0.8, -0.2).normalize();
const earthMaterial = new THREE.ShaderMaterial({
  vertexShader: earthVertexShader,
  fragmentShader: earthFragmentShader,
  uniforms: {
    uEarthTexture: { value: earthTexture },
    uSunDirection: { value: sunDirection },
    uTime: { value: 0 }
  }
});

earthMesh.name = 'DragOrClickEarth';

const atmosphereMaterial = new THREE.ShaderMaterial({
  vertexShader: earthVertexShader,
  fragmentShader: /* glsl */ `
    uniform vec3 uSunDirection;
    varying vec3 vWorldNormal;
    varying vec3 vWorldPosition;
    void main() {
      vec3 normal = normalize(vWorldNormal);
      vec3 viewDir = normalize(cameraPosition - vWorldPosition);
      float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.6);
      float daylight = 0.55 + 0.45 * max(dot(normal, normalize(uSunDirection)), 0.0);
      gl_FragColor = vec4(vec3(0.13, 0.54, 1.0) * fresnel * daylight,
                         fresnel * 0.52);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `,
  uniforms: { uSunDirection: { value: sunDirection } },
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.FrontSide
});

// Pointer interactions use raycasting: dragging rotates Earth rather than the camera.
const globeRaycaster = new THREE.Raycaster();
const globePointer = new THREE.Vector2();
let globeAutoSpin = true;
let draggingGlobe = false;
let globeMoved = false;
let lastPointerX = 0;
let lastPointerY = 0;
function toggleGlobeSpin() {
  globeAutoSpin = !globeAutoSpin;
}

function isPointerOnEarth(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  globePointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  globePointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  globeRaycaster.setFromCamera(globePointer, camera);
  return globeRaycaster.intersectObject(earthMesh, false).length > 0;
}
renderer.domElement.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 && event.pointerType === 'mouse') return;
  if (!isPointerOnEarth(event)) return;
  draggingGlobe = true;
  globeMoved = false;
  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
  isAnimating = false;
  controls.enabled = false;
  renderer.domElement.style.cursor = 'grabbing';
  event.preventDefault();
});
renderer.domElement.addEventListener('pointermove', (event) => {
  if (draggingGlobe) {
    const dx = event.clientX - lastPointerX;
    const dy = event.clientY - lastPointerY;
    if (Math.abs(dx) + Math.abs(dy) > 2) globeMoved = true;
    earthSpin.rotation.y += dx * 0.009;
    earthTilt.rotation.x = THREE.MathUtils.clamp(earthTilt.rotation.x + dy * 0.004, -0.9, 0.9);
    lastPointerX = event.clientX;
    lastPointerY = event.clientY;
    return;
  }
  renderer.domElement.style.cursor = isPointerOnEarth(event) ? 'grab' : 'auto';
});
function finishGlobeDrag() {
  if (!draggingGlobe) return;
  draggingGlobe = false;
  controls.enabled = true;
  renderer.domElement.style.cursor = 'auto';
  if (!globeMoved) toggleGlobeSpin();
}
window.addEventListener('pointerup', finishGlobeDrag);
window.addEventListener('pointercancel', finishGlobeDrag);
window.addEventListener('blur', finishGlobeDrag);
const globeClock = new THREE.Clock();
function getIntersections(event, objects) {
  const rect = renderer.domElement.getBoundingClientRect();
  globePointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  globePointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  globeRaycaster.setFromCamera(globePointer, camera);
  return globeRaycaster.intersectObjects(objects, true);
}
renderer.domElement.addEventListener('click', (event) => {
  const hits = getIntersections(event, pickableObjects);
  if (!hits.length) return;
  const hit = hits[0].object;
  if (typeof hit.userData.onPick === 'function') hit.userData.onPick(hit);
});
// ─── End Earth centerpiece ───

let isAnimating = false;
let targetCamPos = new THREE.Vector3().copy(camera.position);
let targetLookAt = new THREE.Vector3().copy(controls.target);

function moveCameraTo(cx, cy, cz, tx, ty, tz) {
  targetCamPos.set(cx, cy, cz);
  targetLookAt.set(tx, ty, tz);
  isAnimating = true;
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);

  if (isAnimating) {
    camera.position.lerp(targetCamPos, 0.08);
    controls.target.lerp(targetLookAt, 0.08);

    if (camera.position.distanceTo(targetCamPos) < 0.01 && controls.target.distanceTo(targetLookAt) < 0.01) {
      camera.position.copy(targetCamPos);
      controls.target.copy(targetLookAt);
      isAnimating = false;
    }
  }

  // Frame-rate independent automatic rotation; manual drag continues to work.
  const delta = Math.min(globeClock.getDelta(), 0.05);
  if (globeAutoSpin && !draggingGlobe) earthSpin.rotation.y += delta * 0.22;
  earthMaterial.uniforms.uTime.value += delta;
  orbitRing1.rotation.z += delta * 0.045;
  orbitRing2.rotation.y -= delta * 0.035;

  const t = earthMaterial.uniforms.uTime.value;
  if (robotWaveActive > 0) {
    robotWaveActive = Math.max(0, robotWaveActive - delta);
    robotWaveTime += delta * 7.0;
  }
  rightArm.rotation.z = -0.22 - Math.sin(robotWaveTime) * 0.65 * Math.min(robotWaveActive, 1.0);
  leftArm.rotation.z = 0.22 + Math.sin(robotWaveTime * 0.65) * 0.15 * Math.min(robotWaveActive, 1.0);
  toonRobot.position.y = Math.sin(t * 1.8) * 0.03;

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
